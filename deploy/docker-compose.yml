# Warp Gate.
#
# There is no image build. Warp Gate has no dependencies, so a stock node image with
# the source mounted read-only is the whole deployment. Updating is a file copy and a
# restart, and nothing is ever built on this host.
#
# Deploy path on the host: <deploy path>
#   ./app     the project (server/ and public/), mounted read-only
#   ./secrets TUNNEL_TOKEN, only if the cloudflared service below is enabled

services:
  warp-gate:
    image: node:22-alpine # already cached on this host; no pull, no build
    container_name: warp-gate
    restart: unless-stopped
    working_dir: /app
    command: node server/index.js
    environment:
      - WG_HTTP_PORT=3095
      - WG_HTTP_HOST=0.0.0.0
      - WG_STUN_PORT=3479
      # The built-in STUN responder is off: it is only useful if a publicly reachable
      # UDP port is forwarded to this host, which would require publishing the home IP
      # in DNS. Cloudflare's STUN is used instead (see WG_STUN_URL). Set to 1 and
      # re-add the 3479/udp publish below to go back to self-hosting.
      - WG_STUN_ENABLED=${WG_STUN_ENABLED:-0}
      # Cloudflare already terminates TLS for this hostname and therefore already sees
      # both peers' addresses from the signalling connections. Using its STUN server
      # adds no new party to the threat model, needs no port forward, and keeps the
      # home IP out of public DNS. Port 53/udp is an documented alternate that gets
      # through networks which block 3478.
      - WG_STUN_URL=${WG_STUN_URL:-stun:stun.cloudflare.com:3478}
      # Traffic arrives through cloudflared (an existing connector tunnel, host networking) as of
      # 2026-08-08, so CF-Connecting-IP must be trusted: without it every request looks
      # like 127.0.0.1 and all users share a single rate-limit bucket. Safe here only
      # because 3095 is bound to loopback, so nothing external can forge the header.
      - WG_TRUST_PROXY=${WG_TRUST_PROXY:-1}
      # TLS terminates at Cloudflare, so the response is served over HTTPS.
      - WG_HSTS=${WG_HSTS:-1}
    volumes:
      - ./app:/app:ro
    ports:
      # HTTP stays on loopback: cloudflared runs with host networking and reaches it
      # at 127.0.0.1:3095. Nothing else should be able to.
      - "127.0.0.1:3095:3095"
      # No UDP publish: the built-in STUN responder is disabled in favour of
      # Cloudflare's. Re-add "3479:3479/udp" alongside WG_STUN_ENABLED=1 to self-host,
      # which additionally needs a router forward and a DNS record exposing the home IP.
    mem_limit: 128m
    memswap_limit: 128m
    oom_score_adj: 100
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3095/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

