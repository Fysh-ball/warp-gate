# Warp Gate.
#
# There is no image build. Warp Gate has no dependencies, so a stock node image with
# the source mounted read-only is the whole deployment. Updating is a file copy and a
# restart, and nothing is ever built on this host.
#
# Deploy path on the host, wherever you keep it:
#   ./app     the project (server/ and public/), mounted read-only
#   ./secrets TUNNEL_TOKEN, only if the cloudflared service below is enabled

services:
  warp-gate:
    image: node:22-alpine # already cached on this host; no pull, no build
    container_name: warp-gate
    restart: unless-stopped
    working_dir: /app
    command: node server/index.js
    # Not root. Warp Gate binds 3095, reads /app read-only and appends to /data: none of
    # that needs a privileged uid, and node:22-alpine defaults to root if nothing says
    # otherwise.
    #
    # This interacts with `cap_drop: ALL` below in a way that cost a release to learn.
    # Dropping ALL removes CAP_DAC_OVERRIDE, so even uid 0 inside this container is
    # subject to ordinary permission checks: container-root could not write a ./data
    # owned by the host user, the suggestion box refused every submission with
    # `store_unwritable`, and from outside that is indistinguishable from nobody having
    # written to it. Root without CAP_DAC_OVERRIDE is just a uid, and it owned nothing.
    #
    # So the rule for ./data is simple and there is no way around it: it must be owned by
    # the uid named here. Set WG_UID/WG_GID in a .env beside this file to whichever user
    # owns the deployment directory (`id -u`), and chown ./data to match. The fallbacks
    # are this host's measured owner of ./data (3003:999, the deploy user), not a generic
    # 1000:1000: a redeploy that loses the .env used to fall back to a uid that owns
    # nothing here, which is the 2026-08-10 unwritable-store incident again.
    user: "${WG_UID:-3003}:${WG_GID:-999}"
    environment:
      - WG_HTTP_PORT=3095
      - WG_HTTP_HOST=0.0.0.0
      - WG_STUN_PORT=3479
      # The built-in STUN responder is off: it is only useful if a publicly reachable
      # UDP port is forwarded to this host, which would require publishing the home IP
      # in DNS. Cloudflare's STUN is used instead (see WG_STUN_URL). Set to 1 and
      # re-add the 3479/udp publish below to go back to self-hosting.
      - WG_STUN_ENABLED=${WG_STUN_ENABLED:-0}
      # Cloudflare already terminates TLS for this hostname and therefore already sees
      # every participant's address from the signalling connections. Using its STUN
      # adds no new party to the threat model, needs no port forward, and keeps the
      # home IP out of public DNS. Port 53/udp is a documented alternate that gets
      # through networks which block 3478.
      - WG_STUN_URL=${WG_STUN_URL:-stun:stun.cloudflare.com:3478}
      # Traffic arrives through cloudflared (an existing tunnel, host networking) as of
      # 2026-08-08, so CF-Connecting-IP must be trusted: without it every request is keyed
      # by the peer address, which is one address for everybody, and all users share a
      # single rate-limit bucket. Safe here only because 3095 is bound to loopback, so
      # nothing external can forge the header.
      #
      # This service is bridge-networked, so the address the process actually sees is the
      # bridge gateway rather than 127.0.0.1, and the server only reads the forwarding
      # header from an address on its trusted list. See "CONFIRMED: WG_TRUST_PROXY=1 is
      # inert on a bridge network" in NOTES.md.
      - WG_TRUST_PROXY=${WG_TRUST_PROXY:-1}
      # The live stack's bridge gateway, measured 2026-08-11 inside the running container
      # (`docker exec warp-gate ip route` -> default via 172.16.28.1) after the server's
      # own "forwarding header arrived from a hop that is not trusted" warning confirmed
      # the default allowlist was rejecting it. This is the gateway of THIS project's
      # compose network and nothing else: it goes stale if the network is ever recreated
      # or the topology changes, so re-measure with the same command before trusting a
      # different value. Takes effect only when the container is recreated, which
      # destroys live rooms: it rides the next restart-worthy deploy, not a static one.
      - WG_TRUSTED_PROXIES=${WG_TRUSTED_PROXIES:-172.16.28.1}
      # TLS terminates at Cloudflare, so the response is served over HTTPS.
      - WG_HSTS=${WG_HSTS:-1}
      # AGPL-3.0 section 13: network users must be offered the corresponding source.
      #
      # The default below is set, so the offer IS made: /api/config serves it and the
      # boot warning no longer fires. The repository at that URL is public (verified
      # 2026-08-09: it resolves, published as a single squashed commit), so the offer
      # is real. If you deploy a MODIFIED copy, point WG_SOURCE_URL at your version:
      # a URL that 404s is arguably worse than an empty one, because it silences the
      # boot warning while still giving a user no way to obtain the source.
      - WG_SOURCE_URL=${WG_SOURCE_URL:-https://github.com/Fysh-ball/warp-gate}
      # The suggestion box. The ONLY thing this deployment keeps on disk, and the only
      # reason the container has a writable path at all.
      #
      # Unset it and the box disappears from the landing and /api/suggest 404s, which is
      # the right default for a self-hosted copy: it is the operator's own inbox and there
      # is nobody to write to it. Read what has come in, on the host, with:
      #
      #   cat data/suggestions.jsonl
      #
      # It is JSON Lines, one per line, holding the text and the hour and nothing else
      # (server/suggestions.js says why). The sanitising reader also works in-container,
      #
      #   docker compose exec warp-gate node deploy/read-suggestions.mjs /data/suggestions.jsonl
      #
      # but ONLY once a deploy has shipped it: /app holds what the deploy sequence in
      # NOTES.md rsyncs there, which was server/ and public/ alone until 2026-08-11, so on
      # a tree synced before then /app/deploy does not exist and the exec form fails.
      - WG_SUGGESTIONS_PATH=${WG_SUGGESTIONS_PATH:-/data/suggestions.jsonl}
    volumes:
      - ./app:/app:ro
      # The only writable path that PERSISTS. read_only: true below still applies to
      # everything else on the image, so this is the only place a bug in this process can
      # leave anything behind. Note there is a second writable path: the tmpfs at /tmp
      # further down, 8 MB in RAM, discarded on every restart and unused by Warp Gate.
      # The directory must exist on the host before the first start AND be owned by the
      # uid in `user:` above. The server does not create it, because a typo that silently
      # created a second store would mean an operator reading an empty file while
      # suggestions land somewhere they never look. It now says so at boot if it cannot
      # write here, rather than only once per refused submission.
      #
      #   mkdir -p data && chown $(id -u):$(id -g) data && chmod 700 data
      - ./data:/data
    ports:
      # HTTP stays on loopback: cloudflared runs with host networking and reaches it
      # at 127.0.0.1:3095. Nothing else should be able to.
      - "127.0.0.1:3095:3095"
      # No UDP publish: the built-in STUN responder is disabled in favour of
      # Cloudflare's. Re-add "3479:3479/udp" alongside WG_STUN_ENABLED=1 to self-host,
      # which additionally needs a router forward and a DNS record exposing the home IP.
    mem_limit: 128m
    memswap_limit: 128m
    oom_score_adj: 100
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Same probe as the image's own HEALTHCHECK (Dockerfile): port from the environment,
      # j.ok parsed rather than the status trusted, a 3s abort so a hang is not billed the
      # full timeout, and the failure message preserved.
      test: ["CMD", "node", "-e", "const p=process.env.WG_HTTP_PORT||3095;fetch('http://127.0.0.1:'+p+'/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>r.json()).then(j=>process.exit(j&&j.ok?0:1)).catch(e=>{console.error(e.message);process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

